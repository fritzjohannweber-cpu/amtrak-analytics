  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var plots = document.querySelectorAll('.js-plotly-plot');
        plots.forEach(function(gd) {
          gd.on('plotly_relayout', function(eventdata) {
            var x0, x1;
            if (eventdata['xaxis.range[0]'] !== undefined) { x0 = eventdata['xaxis.range[0]']; x1 = eventdata['xaxis.range[1]']; } 
            else if (eventdata['xaxis.range'] !== undefined) { x0 = eventdata['xaxis.range'][0]; x1 = eventdata['xaxis.range'][1]; }
            if (x0 !== undefined && x1 !== undefined) {
              var startIdx = Math.max(0, Math.floor(x0)); var endIdx = Math.ceil(x1); var maxY = 0;
              gd.data.forEach(function(trace) {
                if (trace.y && trace.visible !== 'legendonly') {
                  for (var i = startIdx; i <= endIdx && i < trace.y.length; i++) { if (trace.y[i] > maxY) maxY = trace.y[i]; }
                }
              });
              if (maxY > 0) Plotly.relayout(gd, {'yaxis.range': [0, maxY * 1.15]});
            } else if (eventdata['xaxis.autorange'] === true) { Plotly.relayout(gd, {'yaxis.autorange': true}); }
          });
        });
      }, 500); 
    });
  </script>
